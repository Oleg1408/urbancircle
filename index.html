        body {
            background-color: #060709;

            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 16px;
        }

        /* DYNAMIC GLOW BACKGROUND */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, rgba(255, 204, 0, 0.08) 50%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at top, rgba(18, 24, 38, 0.8) 0%, rgba(6, 7, 9, 0.98) 100%),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop')
                center/cover no-repeat;
            filter: blur(12px);
            transform: scale(1.08);
            z-index: 1;
            opacity: 0.5;
        }

        /* MAIN CARD CONTAINER */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: rgba(15, 18, 26, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 20px 18px 18px;
            text-align: center;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* HEADER & AUTHOR BOX */
        .author-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .author-left {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .author-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        .author-info h2 {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        .author-info p {
            font-size: 11px;
            color: #00ff88;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ffcc00 0%, #ffa800 100%);
            color: #000;
            box-shadow: 0 2px 8px rgba(255, 204, 0, 0.3);
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.25;

            color: #ffffff;

            background: linear-gradient(180deg, #ffffff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .highlight-green {
            color: #00ff88;
            font-weight: 700;
        }

        /* FEATURE BADGES BLOCK */

        }

        .features-title {
            font-size: 10px;

            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .features-list {
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            color: #e5e7eb;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

            font-size: 11px;

            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            font-weight: 700;
        }

            display: flex;

            justify-content: center;

            margin-bottom: 12px;
        }

        .promo-code {

            font-weight: 900;
            letter-spacing: 2px;

            text-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
        }

            gap: 5px;

            border: 1px solid rgba(255, 204, 0, 0.6);

            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
