<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Diego Paredes | Official Hub</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCNSEV7WSP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-ZCNSEV7WSP');
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060709;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 12px;
        }

        /* DYNAMIC GLOW BACKGROUND */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, rgba(255, 204, 0, 0.08) 50%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(18, 24, 38, 0.8) 0%, rgba(6, 7, 9, 0.98) 100%),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') 
                center/cover no-repeat;
            filter: blur(10px);
            transform: scale(1.08);
            z-index: 1;
            opacity: 0.4;
        }

        /* MAIN CARD CONTAINER */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(15, 18, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* HEADER & AUTHOR BOX */
        .author-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            border-radius: 40px;
            margin-bottom: 20px;
        }

        .author-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .author-info h2 {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .author-info p {
            font-size: 11px;
            color: #00ff88;
            font-weight: 600;
            margin-top: 2px;
        }

        /* LANG SWITCHER */
        .lang-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 3px;
            border: 1px solid rgba(255, 204, 0, 0.4);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ffcc00 0%, #ffa800 100%);
            color: #000;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 13.5px;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .highlight-green {
            color: #00ff88;
            font-weight: 700;
        }

        /* COMPACT PROMO BOX */
        .promo-box {
            background: rgba(255, 204, 0, 0.05);
            border: 1px dashed rgba(255, 204, 0, 0.4);
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 10px; /* Прижали близко к кнопке */
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .promo-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .promo-title {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: 700;
        }

        .promo-code {
            color: #ffcc00;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.6);
            color: #ffcc00;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn.copied {
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.15);
        }

        /* MAIN BUTTON WITH SHINE EFFECT */
        .btn-main {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 18px 12px;
            background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
            color: #04150c;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.35);
            animation: pulse 2.5s infinite;
            border: none;
            cursor: pointer;
            overflow: hidden;
        }

        /* Световой блик по кнопке каждые 3 секунды */
        .btn-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -60%; }
            20% { left: 140%; }
            100% { left: 140%; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        /* FULL MOBILE ADAPTIVE (100% SCREEN) */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .card {
                max-width: 100%;
                min-height: 100vh;
                border-radius: 0;
                border: none;
                padding: 32px 20px;
                display: flex;
                flex-direction: column;
                justify-content: center; /* Центрируем весь контент по вертикали */
                box-shadow: none;
            }
            h1 {
                font-size: 26px;
            }
            .btn-main {
                padding: 20px 12px;
                font-size: 19px;
            }
        }

        /* TOAST NOTIFICATION */
        #toast-popup {
            position: fixed !important;
            bottom: 20px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 99999999 !important;
            background: rgba(18, 22, 31, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(0, 255, 136, 0.4) !important;
            border-radius: 20px !important;
            padding: 10px 18px !important;
            display: none;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8) !important;
        }

        .toast-text {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
        }

        .toast-text .highlight {
            color: #00ff88;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>
    <div class="bg-overlay"></div>

    <div class="card">

        <div>
            <!-- AUTHOR HEADER & LANG SWITCHER -->
            <div class="author-box">
                <div class="author-left">
                    <img src="paredez.png" alt="Diego Paredes" class="author-avatar">
                    <div class="author-info">
                        <h2>Diego Paredes <span id="geo-flag">🇵🇪</span></h2>
                        <p id="verified-text">✓ Canal Oficial Perú</p>
                    </div>
                </div>
                <div class="lang-switch">
                    <button type="button" class="lang-btn active" id="btn-es" onclick="switchLang('es')">ES</button>
                    <button type="button" class="lang-btn" id="btn-en" onclick="switchLang('en')">EN</button>
                </div>
            </div>

            <h1 id="main-title">Acceso Oficial</h1>

            <p class="subtitle" id="main-subtitle">
                Haz clic en continuar para acceder a la plataforma y activar tu bono con el código <span class="highlight-green">GS2026</span>.
            </p>

            <!-- COMPACT PROMO CODE BOX -->
            <div class="promo-box">
                <div class="promo-left">
                    <span class="promo-title" id="promo-title">Código:</span>
                    <span class="promo-code" id="promo-code-text">GS2026</span>
                </div>
                <button type="button" class="copy-btn" id="copy-btn">
                    📋 <span id="copy-text">Copiar</span>
                </button>
            </div>

            <!-- MAIN BUTTON WITH BLINK/SHINE -->
            <a href="#" id="offer-link" class="btn-main">
                <span id="btn-text">CONTINUAR ➔</span>
            </a>
        </div>

    </div>

    <!-- TOAST POPUP -->
    <div id="toast-popup">
        <div class="toast-text" id="toast-message"></div>
    </div>

    <script>
        const BASE_OFFER_URL = "https://one-vv3591.com/?open=register&p=tb2e";
        const promoCode = "GS2026";
        
        let currentLang = "es";

        const i18n = {
            es: {
                flag: "🇵🇪",
                verified: "✓ Canal Oficial Perú",
                title: "Acceso Oficial",
                subtitle: "Haz clic en continuar para acceder a la plataforma y activar tu bono con el código <span class='highlight-green'>GS2026</span>.",
                promoTitle: "Código:",
                copy: "Copiar",
                copied: "Copiado",
                toastCopied: "¡Código <span class='highlight'>GS2026</span> copiado!",
                btn: "CONTINUAR ➔"
            },
            en: {
                flag: "🌐",
                verified: "✓ Official Hub",
                title: "Official Access",
                subtitle: "Click continue to access the platform and activate your bonus using code <span class='highlight-green'>GS2026</span>.",
                promoTitle: "Code:",
                copy: "Copy",
                copied: "Copied",
                toastCopied: "Code <span class='highlight'>GS2026</span> copied!",
                btn: "CONTINUE ➔"
            }
        };

        function setupRefLinkWithUTM() {
            const currentParams = new URLSearchParams(window.location.search);
            const targetUrl = new URL(BASE_OFFER_URL);
            currentParams.forEach((value, key) => {
                targetUrl.searchParams.set(key, value);
            });
            document.getElementById("offer-link").href = targetUrl.toString();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById("btn-es").classList.toggle("active", lang === 'es');
            document.getElementById("btn-en").classList.toggle("active", lang === 'en');

            const t = i18n[lang];
            document.getElementById("geo-flag").textContent = t.flag;
            document.getElementById("verified-text").textContent = t.verified;
            document.getElementById("main-title").textContent = t.title;
            document.getElementById("main-subtitle").innerHTML = t.subtitle;
            document.getElementById("promo-title").textContent = t.promoTitle;
            document.getElementById("copy-text").textContent = t.copy;
            document.getElementById("btn-text").textContent = t.btn;
        }

        function showToast(messageHtml) {
            const toast = document.getElementById("toast-popup");
            const toastMsg = document.getElementById("toast-message");
            if (!toast || !toastMsg) return;

            toastMsg.innerHTML = messageHtml;
            toast.style.display = "flex";

            setTimeout(() => {
                toast.style.display = "none";
            }, 2000);
        }

        const copyButton = document.getElementById("copy-btn");
        async function copyPromoCode() {
            try {
                await navigator.clipboard.writeText(promoCode);
            } catch (error) {
                const textArea = document.createElement("textarea");
                textArea.value = promoCode;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }
            const t = i18n[currentLang];
            document.getElementById("copy-text").textContent = t.copied;
            copyButton.classList.add("copied");

            showToast(t.toastCopied);

            setTimeout(() => {
                document.getElementById("copy-text").textContent = t.copy;
                copyButton.classList.remove("copied");
            }, 2000);
        }

        copyButton.addEventListener("click", copyPromoCode);

        document.addEventListener("DOMContentLoaded", function () {
            setupRefLinkWithUTM();
            switchLang("es");
        });
    </script>

</body>
</html>
